spring.application.name=retry-service
server.port=${RETRY_SERVICE_PORT:8090}

# ─── Database Configuration (postgres-retry) ───
spring.datasource.url=${RETRY_DB_URL:jdbc:postgresql://fintech_postgres_retry:5432/fintech_retry}
spring.datasource.username=${DB_USER:fintech_user}
spring.datasource.password=${DB_PASS:fintech_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.open-in-view=false

# ─── Kafka Configuration ───
spring.kafka.bootstrap-servers=${KAFKA_HOST:kafka}:${KAFKA_PORT:9093}
spring.kafka.consumer.group-id=retry-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# ─── Retry Configuration ───
retry.default.max-retries=5
retry.default.delay-seconds=60
retry.backoff.multiplier=2
retry.scan.ms=60000
retry.stuck.threshold-minutes=15
retry.stuck.scan.ms=300000
retry.cleanup.retention-days=30
retry.cleanup.cron=0 0 2 * * ?

# ─── Kafka Topics ───
retry.kafka.request-topic=retry-requests
retry.kafka.callback-topic=retry-callbacks
retry.kafka.result-topic=retry-results

# ─── TLS/SSL (mTLS for inter-service calls) ───
tls.client.key-store=${SSL_KEYSTORE_PATH:file:/app/certs/fintech.p12}
tls.client.key-store-password=${SSL_KEYSTORE_PASSWORD:Shekhar@123}
tls.client.trust-store=${TRUST_STORE:file:/app/certs/fintech-truststore.jks}
tls.client.trust-store-password=${TRUST_STORE_PASSWORD:Shekhar@123}

# ─── Actuator ───
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# ─── Logging ───
logging.level.com.fintech.retryservice=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
