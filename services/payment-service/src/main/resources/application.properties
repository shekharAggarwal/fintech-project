spring.application.name=payment-service

# Snowflake ID generator configuration
snowflake.node-id=1

# Fraud Detection Configuration
fraud.detection.enabled=true
fraud.detection.approve-threshold=30
fraud.detection.block-threshold=70

# Velocity rule: max transactions in time window
fraud.detection.velocity.max-transactions=10
fraud.detection.velocity.window-minutes=5
fraud.detection.velocity.risk-score=40

# Amount anomaly: flag transactions > multiplier x average
fraud.detection.amount.anomaly-multiplier=3.0
fraud.detection.amount.risk-score=50

# Unusual time: suspicious hours (UTC)
fraud.detection.time.suspicious-start-hour=1
fraud.detection.time.suspicious-end-hour=5
fraud.detection.time.risk-score=25

# Unusual destination: first-time + large amount
fraud.detection.destination.large-amount-threshold=5000.0
fraud.detection.destination.risk-score=35

# Blacklist: known fraudulent accounts
fraud.detection.blacklist.risk-score=90
fraud.detection.blacklist.accounts=

# Kafka topics for fraud events
kafka.topics.fraud-alerts=fraud.alerts

# Transaction Limit Configuration
transaction.limits.per-transaction=10000.00
transaction.limits.daily=50000.00
transaction.limits.weekly=200000.00
transaction.limits.monthly=500000.00
transaction.limits.default-currency=USD
transaction.limits.auto-create-on-first-transaction=true

# Saga configuration
saga.timeout.minutes=5
saga.timeout.check-interval-ms=60000

# Saga Kafka topics
kafka.topics.saga-transaction-completed=saga.transaction.completed
kafka.topics.saga-transaction-failed=saga.transaction.failed
kafka.topics.saga-timeout=saga.timeout
#
