spring.application.name=notification-service

# ─── SMS Provider Configuration ────────────────────────────────────────────────
# Options: mock (default), twilio
notification.sms.provider=mock

# Twilio (only needed when notification.sms.provider=twilio)
# notification.sms.twilio.account-sid=YOUR_ACCOUNT_SID
# notification.sms.twilio.auth-token=YOUR_AUTH_TOKEN
# notification.sms.twilio.from-number=+1234567890

# ─── Push Provider Configuration ──────────────────────────────────────────────
# Options: mock (default), firebase
notification.push.provider=mock

# Firebase (only needed when notification.push.provider=firebase)
# notification.push.firebase.credentials-path=/path/to/service-account.json
# notification.push.firebase.project-id=your-project-id

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
